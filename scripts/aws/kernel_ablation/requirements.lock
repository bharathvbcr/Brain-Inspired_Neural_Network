# The environment the pinned reference series was measured in, pinned so the
# aarch64 Linux box reproduces it rather than resolving something newer.
#
# HK-4 is the gate this exists for: Arm A must land within 0.010 of the pinned
# 0.9376 or nothing else in the series is read. Every version below is the one
# `.venv-shd-cal` on the machine that produced 0.9390 / 0.9368 / 0.9371 holds,
# read from `pip freeze` rather than chosen. torch 2.13.0 ships a
# manylinux_2_28_aarch64 cp312 wheel, so the torch build matches exactly and
# only the OS differs.
#
# `wandb` is here because `model.py` imports it at module scope even with
# logging off. An absent import is a crash, not a disabled feature.
