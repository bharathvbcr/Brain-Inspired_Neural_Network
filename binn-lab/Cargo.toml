[package]
name = "binn-lab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BINN L7 experiment harness: runner, seeds, logging, plots"

[features]
default = []
# Optional plotters backend (viz only). CI keeps this off; enable with
# `--features plots`. Never on the scientific hot path / config hashes.
plots = ["dep:plotters", "dep:svg2pdf", "dep:usvg", "dep:resvg"]
# Optional Polars result-table harvest (not on scientific hot path).
tables = ["dep:polars"]
# Documentation / discoverability alias for the C2 kill-gate override.
# The binary still requires `--enable-c2` (or env) at runtime; this feature
# does not silently schedule C2.
enable-c2 = []
# Same pattern for post-G2 exploratory branches C3 / R1 / R2.
enable-c3 = []
enable-r1 = []
enable-r2 = []

[dependencies]
binn-data = { workspace = true }
binn-learn = { workspace = true }
binn-areas = { workspace = true }
binn-engine = { workspace = true }
binn-core = { workspace = true }
plotters = { version = "0.3.7", optional = true, default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "svg_backend",
    "line_series",
    "point_series",
    "full_palette",
    "ttf",
] }
svg2pdf = { version = "0.13", optional = true, default-features = false, features = ["text"] }
usvg = { version = "0.45", optional = true, default-features = false, features = ["text", "system-fonts"] }
resvg = { version = "0.45", optional = true, default-features = false, features = ["text", "system-fonts"] }
polars = { version = "0.46", optional = true, default-features = false, features = [
    "csv",
    "dtype-slim",
    "fmt",
] }

