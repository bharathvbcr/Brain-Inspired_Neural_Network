[package]
name = "binn-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BINN L2 numeric core: buffers, RNG, SIMD, sparse, scan"
# GC3 determinism runs as a unit test in `src/lib.rs`
# (`gc3_same_seed_identical_output_hash`). The criterion bench for the SIMD hot
# path lives in `benches/simd_leak_integrate.rs` (GC5).

[features]
default = []
# Metal SpMV/LIF via sparsl. Without this feature `Backend::MetalGpu` stays
# unconstructible; with it, availability still requires a live Metal device.
gpu = ["sparsl/metal"]
# Cross-crate SharedEvent/MTLBuffer handoff against published tessl.
tessl-interop = ["gpu", "dep:tessl"]

[dependencies]
# Both from crates.io at exact versions, so a fresh clone builds. They were
# path dependencies on sibling checkouts until 2026-09-29, which no clone has
# and which moved under the lock (tessl reached 0.2.0 while Cargo.lock pinned
# 0.1.4). The published 0.3.0 and 0.1.4 packages were diffed against the git
# commits the lock described (sparsl ef15f28e, tessl 1085d7f1): src/, build.rs,
# kernels/ and the manifest are identical. To develop against a local
# checkout, override with an untracked `[patch.crates-io]` entry.
sparsl = "=0.3.0"
tessl = { version = "=0.1.4", optional = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "simd_leak_integrate"
harness = false
path = "benches/simd_leak_integrate.rs"

[[example]]
name = "w0_gpu_crossover"
required-features = ["gpu"]
