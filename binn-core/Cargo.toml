[package]
name = "binn-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BINN L2 numeric core: buffers, RNG, SIMD, sparse, scan"
# GC3 determinism runs as a unit test in `src/lib.rs`
# (`gc3_same_seed_identical_output_hash`). The criterion bench for the SIMD hot
# path lives in `benches/simd_leak_integrate.rs` (GC5).

[features]
default = []
gpu = ["dep:metal", "dep:objc"]

[dependencies]
metal = { workspace = true, optional = true }
objc = { workspace = true, optional = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "simd_leak_integrate"
harness = false
path = "benches/simd_leak_integrate.rs"
