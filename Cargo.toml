[workspace]
resolver = "2"
members = [
    "binn-core",
    "binn-engine",
    "binn-areas",
    "binn-learn",
    "binn-data",
    "binn-lab",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
binn-core = { path = "binn-core" }
binn-engine = { path = "binn-engine" }
binn-areas = { path = "binn-areas" }
binn-learn = { path = "binn-learn" }
binn-data = { path = "binn-data" }
binn-lab = { path = "binn-lab" }

# Allowed crates (BINN_Agent_Build_Spec_v8 §2)
rand = "0.8"
rand_chacha = "0.3"
proptest = "1"
rayon = "1"
criterion = "0.5"

[profile.bench]
lto = false
