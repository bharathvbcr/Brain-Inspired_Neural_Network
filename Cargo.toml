[workspace]
resolver = "2"
members = [
    "binn-core",
    "binn-engine",
    "binn-areas",
    "binn-learn",
    "binn-data",
    "binn-lab",
    "binn-hybrid-learn",
    "binn-hybrid-lab",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
binn-core = { path = "binn-core" }
binn-engine = { path = "binn-engine" }
binn-areas = { path = "binn-areas" }
binn-learn = { path = "binn-learn" }
binn-data = { path = "binn-data" }
binn-lab = { path = "binn-lab" }
binn-hybrid-learn = { path = "binn-hybrid-learn" }
binn-hybrid-lab = { path = "binn-hybrid-lab" }

# Allowed crates (BINN_Agent_Build_Spec_v8 §2)
metal = "0.29"
objc = "0.2"
rand = "0.8"
rand_chacha = "0.3"
proptest = "1"
rayon = "1"
criterion = "0.5"

# Release and bench must use IDENTICAL codegen settings, otherwise criterion
# numbers do not describe the binary that actually runs experiments.
#
# Defaults were opt-level=3 / lto=false / codegen-units=16. With 16 codegen
# units LLVM cannot inline across unit boundaries, which matters here because
# the hot paths (`simd_leak_integrate`, `assoc_scan`'s `combine` closure, the
# CSR SpMV inner loop, `Cell::deposit`) are small functions called from other
# crates in the workspace. Cross-crate inlining requires LTO.
#
# Cost: full workspace release builds get slower (single codegen unit + fat
# LTO). These settings introduce no float reassociation of their own — rustc
# does not enable fast-math.
#
# They do NOT, however, make output identical across optimisation levels. The
# SHD attention read-out produces different f32 results at `-C opt-level` 0/1
# than at 2/3; the flip reproduces with only `-C opt-level` varying, so it is
# not caused by LTO or `codegen-units`, and the mechanism is not identified
# (`--fp-contract=off` does not change it). Measured 2026-08-22; see the pin
# comment beside `every_attention_arm_forward_and_backward_is_bit_pinned` in
# `binn-learn/src/shd_matched_arms.rs`. Compare bit-identity only between
# builds at the same optimisation level — every recorded cell is `--release`.
[profile.release]
lto = "fat"
codegen-units = 1
# Integer overflow must never wrap silently in a scientific instrument. Rust's
# release default is `overflow-checks = off`, and every experiment runs
# `--release`, so a wrapping subtraction would corrupt results rather than stop
# the run — exactly the failure mode found in `binn-engine::queue`
# (cursor overtaking a scheduled event; see `jump_to_earliest`).
#
# Cost is ~nothing at this workload (~30 s rebuild, no measurable runtime
# effect). This is a PROVENANCE EVENT: it changes `rust_binary`, which
# `scripts/shd_calibration/runner.py::ensure_manifest` hashes, so any report
# produced before this line must not be compared by binary hash to one produced
# after it. Discharge under AMENDMENT_2026-08-03_PROVENANCE_DISCHARGE_BY_BIT_IDENTITY.
overflow-checks = true

[profile.bench]
lto = "fat"
codegen-units = 1

[patch.crates-io]
block = { path = "patches/block" }

