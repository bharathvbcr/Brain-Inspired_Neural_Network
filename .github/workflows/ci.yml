name: binn-ci

on:
  push:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "scripts/**"
      - ".github/workflows/ci.yml"

jobs:
  check:
    # arm64 macOS, not x86_64 Linux, because two tests pin exact float bit
    # patterns of kernel output and those patterns are a property of the ISA.
    # x86_64 and aarch64 differ in FMA contraction and in libm, so
    # `every_arm_forward_and_backward_is_bit_pinned` cannot pass on both from
    # one set of pins. It failed on ubuntu for that reason, not because the
    # kernels had moved. Running where the pins were recorded makes the gate
    # test the platform it actually describes.
    #
    # `macos-latest` is macOS 26 arm64 today, matching the machine the pins
    # come from. The label floats: when GitHub moves it to a newer image the
    # pins may move with libm, and the fix then is to re-pin deliberately or to
    # switch this to `macos-26`. GitHub announces those moves with lead time.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        # `rg` ships in the ubuntu image but not the macOS one, and
        # `gc_checks.sh` calls it eleven times. Without this the guardrail step
        # dies on "command not found" — a check that could not run, reported
        # the same way as one that ran and failed. That is the exact confusion
        # the GC suite exists to prevent, so it is installed rather than
        # tolerated.
        run: brew install ripgrep

      - name: Install numpy
        # Same shape as ripgrep above: the ubuntu image ships numpy, the macOS
        # one does not, and `scripts/shd_calibration/runner.py` imports it. The
        # final step died on `ModuleNotFoundError` after every Rust gate had
        # already passed — again, a check that could not run rather than one
        # that ran and failed.
        #
        # numpy only. `torch` appears in `scripts/`, but solely in
        # `reference_clean_main.py`, which none of the five checks below reach —
        # the CI traceback got as far as `runner.py:18`, proving the package
        # imports without it. Installing it would add a large download for
        # nothing.
        #
        # `--break-system-packages` because the runner's Python is
        # PEP 668 externally managed; this is a throwaway runner, not a system
        # whose packages need protecting.
        run: python3 -m pip install --break-system-packages numpy

      - name: Install numpy
        # `test_gate_f_discharge.py` imports `shd_calibration.runner`, which
        # imports numpy at module scope — and not decoratively: `arms.py`,
        # `data.py` and `model.py` each build `np.float32` constants while the
        # module is loading, so the existing `h5py` stub trick cannot be
        # extended to it without faking a numeric type.
        #
        # torch is NOT needed. It appears only in `reference_clean_main.py`,
        # which `runner.py` does not import, so CI does not carry a
        # multi-hundred-megabyte dependency for a test that reads JSON.
        #
        # The ubuntu image shipped numpy; the macOS one does not. The fallback
        # covers PEP 668: the runner's Python is Homebrew's and therefore
        # externally managed, but the flag is harmless where it is not.
        run: |
          python3 -m pip install --break-system-packages numpy             || python3 -m pip install numpy
          python3 -c 'import numpy; print("numpy", numpy.__version__)'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --locked --workspace

      # The step above runs at opt-level 0. Every scientific cell is produced by
      # a release build, and `positional_code`'s sin/cos pair is merged into a
      # combined libcall at opt-level >= 2, so the attention arms hash
      # differently between the two profiles. Without this, a change that moved
      # only the optimised side would pass CI and alter every future cell.
      - name: Kernel in both profiles
        run: ./scripts/check_kernel_profiles.sh

      - name: GC1–GC7 guardrails
        run: ./scripts/gc_checks.sh

      # GC4 once hung for two days on a ripgrep call with no path argument,
      # which falls back to reading stdin. A check that never answers cannot be
      # told from one that passed, so the shape is scanned for rather than
      # remembered. The scanner refuses to report unless it first catches its
      # own fixture.
      - name: No check waits forever, or passes on silence
        run: |
          python3 scripts/check_no_stdin_hangs.py
          python3 scripts/test_gc4_gate.py
          python3 scripts/test_gate_f_timeout.py
          python3 scripts/test_gate_f_discharge.py
          python3 scripts/test_campaign_tooling.py
