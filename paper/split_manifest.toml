# Where the page limit falls.
#
# The split below was drawn for NeurIPS 2026's nine content pages. The venue
# is now TMLR (2026-09-29), which has no hard limit but stops promising its
# review timeline above twelve pages of main content; `build_paper.py` holds
# the main text to twelve. References and appendices do not count, so the
# split is a decision about what a reviewer must read to judge the lead claim,
# not about what is worth keeping. The "nine pages" reasons in the comments
# below are the history of each move, not a constraint that still binds.
#
# [front] names the two sections TMLR typesets outside the body: the abstract
# (one paragraph, in the style's abstract environment) and the LLM-use
# disclosure (the footnote TMLR requires on the first page). A section named
# here must not also be in [main] or [appendix]; the build refuses both.

[front]
abstract = "Abstract"
disclosure = "LLM-use disclosure"
#
# The principle: the MAIN TEXT is the SHD read-out programme end to end --
# what the difference-in-differences is, every control on it, every scope
# limit, and the reproducibility statement. The APPENDIX is the secondary
# matched-architecture programme, which the manuscript itself describes as
# "supporting material", plus the integrity appendices.
#
# A section listed in neither list is an ERROR, not a default. `build_paper.py`
# refuses to build rather than silently dropping prose out of the paper, which
# is the failure this file exists to make impossible.

[main]
# Reordered 2026-09-29 for TMLR: the introduction first, related work second.
# The build numbers sections in THIS order (1, 2, ... and N.k), and rewrites
# every cross-reference in the prose to match; the draft keeps its own numbers
# because other documents in the record cite them.
sections = [
  "1. Introduction",
  "0. What is new here, and what is not",
  "2. Methods",
  "2.3 SHD attention readout",
  "2.4 Preregistration, frozen hashes, and kill-gates",
  "3. Results",
  "3.5 SHD attention read-out and mechanism",
  "4. Discussion and limitations",
  "4.6 Neuromorphic benchmark scope and non-claims",
  "4.7 The withdrawal ledger",
  "4.8 Open problems",
  "5. Reproducibility",
]

[appendix]
# Lettered in this order. An entry starting "Appendix X" or "Abstract", or
# listed in [numbering] promote, opens a new appendix; any other entry is a
# subsection of the appendix before it. The lead programme's appendices come
# first; the secondary matched-architecture programme is ONE appendix with its
# sections under it, followed by its integrity notes.
#
# History of the moves, kept because each was a decision: 3.8 left the main
# text 2026-09-03 (the kernel +0.3111 / membrane +0.1666 / 0.0378 arithmetic);
# Appendices C and D merged in 2026-09-07 from the standalone instrument
# manuscript; E (the width collapse) and F (waves 26-28) left 3.5 on
# 2026-09-07; G took two paragraphs from 4.6; H and I left the main text so a
# verbatim block and a seven-column table stopped displacing the figures; J is
# framing the nine-page budget could not afford. 4.1 moved here 2026-09-29: it
# is about the matched programme, and in the main text its title ("Lead
# claim") told a reviewer the appendix was the lead.
sections = [
  "Appendix K — Every operating point, with intervals",
  "Appendix E — The width collapse at h1024",
  "Appendix I — The resolution ladder",
  "Appendix F — What the advantage runs through",
  "3.7 The read-out does not substitute for temporal state in the substrate",
  "3.8 Where 0.8320 sits against the literature, and why the gap is a class difference",
  "Appendix G — The calibration criteria and the 0.80 floor",
  "Appendix C — The withdrawal ledger in full",
  "Appendix H — Reproduction commands",
  "Abstract — matched-architecture kill gate (secondary program)",
  "2.1 Matched dense-LIF control",
  "2.2 Engine C1 / Gate G2",
  "3.1 Matched-architecture primary results",
  "3.2 Engine C1 secondary results",
  "3.3 Live transfer, gap-close, and break-it",
  "3.4 Task evidence",
  "3.6 The reference is undertrained, and the task saturates",
  "4.1 Lead claim and mechanism",
  "4.2 Transfer barrier and live negatives",
  "4.3 Baselines and EventProp H2H",
  "4.4 Efficiency honesty (F1 / F2 / F5)",
  "4.5 Appendix-only: G3 / G4 / H0 (do not reopen G2)",
  "Appendix A — Integrity limitations (protocol v2)",
  "Appendix B — Post-G2 harvest (banner)",
  "Appendix D — Non-claims: the matched and engine programs",
  "Appendix J — A converse result, and what it does not license",
]

[numbering]
promote = [
  "3.7 The read-out does not substitute for temporal state in the substrate",
  "3.8 Where 0.8320 sits against the literature, and why the gap is a class difference",
]

# Display titles, where the draft's heading is repository shorthand. The draft
# heading stays the key everywhere else.
[titles]
"0. What is new here, and what is not" = "Related work: what is new here, and what is not"
"2.4 Preregistration, frozen hashes, and kill-gates" = "Preregistration and frozen configurations"
"4.6 Neuromorphic benchmark scope and non-claims" = "Scope and non-claims"
"4.7 The withdrawal ledger" = "Withdrawn results"
"Appendix C — The withdrawal ledger in full" = "Withdrawn results in full"
"3.8 Where 0.8320 sits against the literature, and why the gap is a class difference" = "Where the instrument sits against the literature"
"Abstract — matched-architecture kill gate (secondary program)" = "Secondary programme: a matched-architecture kill gate"
"4.1 Lead claim and mechanism" = "The matched-architecture claim"
"4.5 Appendix-only: G3 / G4 / H0 (do not reopen G2)" = "G3, G4 and H0"
"Appendix B — Post-G2 harvest (banner)" = "Post-G2 results"
